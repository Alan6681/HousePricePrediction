name: CI Workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint Code
        run: |
          echo "Linting repository"
          # Example: Uncomment below to enable flake8
          # pip install flake8
          # flake8 .

      - name: Run Unit Tests
        run: |
          echo "Running unit tests"
          # Example: Uncomment below to enable pytest
          # pip install pytest
          # pytest -v
